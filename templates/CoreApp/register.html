{% extends 'CoreApp/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">

                <p style="
                    color: #9b6f2f;
                    font-size: 12px;
                    font-weight: 700;
                    letter-spacing: 3px;
                    margin-bottom: 8px;
                ">
                    JOIN BOOKNEST
                </p>

                <h1 style="
                    font-family: Georgia, serif;
                    color: #35161b;
                    margin-bottom: 8px;
                ">
                    Create Your Account
                </h1>

                <p class="text-muted">
                    Join our community of readers and book lovers.
                </p>

            </div>

            <div class="card border-0 shadow-sm"
                 style="
                    border-radius: 20px;
                    overflow: hidden;
                 ">

                <div class="card-body p-4 p-md-5">

                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-4">

                            <label class="form-label"
                                   style="
                                       color: #35161b;
                                       font-weight: 600;
                                   ">
                                Username
                            </label>

                            <input type="text"
                                   name="username"
                                   class="form-control"
                                   placeholder="Choose a username"
                                   required
                                   style="
                                       padding: 12px 15px;
                                       border-radius: 10px;
                                   ">

                        </div>

                        <!-- Email -->
                        <div class="mb-4">

                            <label class="form-label"
                                   style="
                                       color: #35161b;
                                       font-weight: 600;
                                   ">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter your email address"
                                   required
                                   style="
                                       padding: 12px 15px;
                                       border-radius: 10px;
                                   ">

                        </div>

                        <!-- Password -->
                        <div class="mb-4">

                            <label class="form-label"
                                   style="
                                       color: #35161b;
                                       font-weight: 600;
                                   ">
                                Password
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   placeholder="Create a password"
                                   required
                                   style="
                                       padding: 12px 15px;
                                       border-radius: 10px;
                                   ">

                        </div>

                        <button type="submit"
                                class="btn btn-brown w-100"
                                style="
                                    padding: 12px;
                                    border-radius: 10px;
                                ">
                            Create Account
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">
                            Already have an account?
                            <a href="{% url 'login' %}"
                               style="
                                   color: #7a1f2b;
                                   font-weight: 600;
                                   text-decoration: none;
                               ">
                                Login
                            </a>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
