{% extends 'CoreApp/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <h2 class="mb-4">Login to BookNest</h2>

            <!-- Success message after registration -->
            {% if success %}
                <div class="alert alert-success" style="border-radius: 10px;">
                    {{ success }}
                </div>
            {% endif %}

            <!-- Error message for wrong login details -->
            {% if error %}
                <div class="alert alert-danger" style="border-radius: 10px;">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="name">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           id="name"
                           required>
                </div>

                <div class="mb-3">
                    <label for="password">Password</label>
                    <input type="password"
                           name="password"
                           id="password"
                           class="form-control"
                           required>
                </div>

                <button type="submit" class="btn btn-dark">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
